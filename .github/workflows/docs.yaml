name: Docs

# The docs at babarot.me/gh-infra are published when a release is made, from
# the commit released: Release calls this workflow after tagpr makes the
# release. Published from main, they would describe fields and behavior that
# the release people install does not have yet, and the CI examples install
# that release. A tag push cannot start this workflow instead: tagpr pushes
# the tag with the workflow's own token, and such a push starts no workflow.
#
# Running it by hand on main publishes main, together with whatever main has
# that is not released yet; use it for a fix that cannot wait for a release.
# The github-pages environment refuses any other branch. A release is
# published again by re-running the docs job of its Release run.
#
# On a pull request it only builds, so a change that breaks the build is
# caught before it reaches a release.
on:
  pull_request:
    paths:
      - "docs/**"
      - "mise.toml"
      - ".github/workflows/docs.yaml"
  workflow_call:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          # src/plugins/since.mjs reads the release tags to mark when each field and
          # flag arrived
          fetch-depth: 0
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
      - run: mise run docs:install
      - run: mise run docs:test
      - run: mise run docs:build
        env:
          SITE_URL: https://babarot.me
          BASE_PATH: /gh-infra
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
